# Builds the iOS app and uploads it to TestFlight (App Store Connect).
#
# Signing is cloud-managed: Xcode asks Apple for the distribution certificate and
# provisioning profile through an App Store Connect API key, so no .p12 or
# .mobileprovision has to be kept in the repository or in secrets.
#
# Required repository secrets:
#   APPLE_TEAM_ID                     10-character team id (Membership details in developer.apple.com)
#   APP_STORE_CONNECT_KEY_ID          Key ID of the API key
#   APP_STORE_CONNECT_ISSUER_ID       Issuer ID shown above the API keys list
#   APP_STORE_CONNECT_PRIVATE_KEY     Full contents of the downloaded AuthKey_XXXX.p8 file
#
# The API key needs the Admin role so Xcode may create the cloud-managed distribution
# certificate. The app record (bundle id com.taxaup.app) must already exist in App Store Connect.
name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - 'ios-v*'

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    # Keep the native ARM performance while avoiding the capacity-constrained macos-26 image.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SCHEME: ServeUp
      WORKSPACE: ios/ServeUp.xcworkspace
      BUNDLE_ID: com.taxaup.app
      # Every upload needs a build number higher than the previous one.
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json', 'ios/Podfile') }}

      # GoogleService-Info.plist is not versioned. Without it the app is built with no Firebase
      # configuration and push notifications never start.
      #   FIREBASE_IOS_PLIST_BASE64   base64 of the GoogleService-Info.plist of the iOS app com.taxaup.app
      - name: Write Firebase configuration
        env:
          FIREBASE_IOS_PLIST_BASE64: ${{ secrets.FIREBASE_IOS_PLIST_BASE64 }}
        run: |
          if [ -z "$FIREBASE_IOS_PLIST_BASE64" ]; then
            echo "::warning::FIREBASE_IOS_PLIST_BASE64 is not set: the build has no Firebase and push notifications will not work."
            exit 0
          fi
          printf '%s' "$FIREBASE_IOS_PLIST_BASE64" | base64 --decode > ios/GoogleService-Info.plist

      # The file only reaches the app if the target lists it as a resource. The Xcode project in
      # the repository does not, so contributors without the secret still build; CI adds it here.
      - name: Bundle Firebase configuration
        working-directory: ios
        run: |
          [ -f GoogleService-Info.plist ] || exit 0
          bundle exec ruby -e '
            require "xcodeproj"
            project = Xcodeproj::Project.open("ServeUp.xcodeproj")
            target = project.targets.find { |item| item.name == "ServeUp" }
            reference = project.main_group.find_file_by_path("GoogleService-Info.plist") ||
              project.main_group.new_file("GoogleService-Info.plist")
            target.resources_build_phase.add_file_reference(reference, true)
            project.save
          '

      - name: Install CocoaPods
        working-directory: ios
        run: bundle exec pod install

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Archive without signing: GitHub-hosted macOS runners have no registered development
      # device, while the next step can obtain the cloud-managed App Store profile for export.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            2>&1 | tee "$RUNNER_TEMP/archive.log"

      # The real compiler messages are buried under thousands of lines of build graph.
      - name: Show archive errors
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/archive.log"
          echo "=== disk and memory ==="
          df -h / /System/Volumes/Data 2>/dev/null | head -4
          vm_stat | head -6
          echo "=== lines with error-like text ==="
          grep -nEi "error|fatal|undefined symbols|no space left|killed|segmentation|signal|crash|PLEASE submit" "$LOG" \
            | grep -v "Explicit dependency" | grep -v "warning:" | cut -c1-400 | tail -80 || true
          echo "=== 60 lines before the first failed command ==="
          N=$(grep -n -m1 "failed with a nonzero exit code" "$LOG" | cut -d: -f1)
          if [ -n "$N" ]; then sed -n "$((N>60 ? N-60 : 1)),$((N+3))p" "$LOG" | cut -c1-400; fi
          echo "=== unresolved symbols ==="
          N=$(grep -n -m1 "Undefined symbols for architecture" "$LOG" | cut -d: -f1)
          if [ -n "$N" ]; then sed -n "${N},$((N+40))p" "$LOG" | cut -c1-1000; fi
          echo "=== final archive output ==="
          tail -100 "$LOG" | cut -c1-400 || true

      - name: Verify Firebase configuration in archive
        run: |
          CONFIG="$RUNNER_TEMP/App.xcarchive/Products/Applications/ServeUp.app/GoogleService-Info.plist"
          test -f "$CONFIG" || { echo "Firebase plist was not bundled in the app archive."; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :BUNDLE_ID" "$CONFIG" | grep -qx "$BUNDLE_ID" \
            || { echo "Firebase plist does not match the TaxaUp bundle identifier."; exit 1; }

      # An unsigned archive carries no entitlements, and the export only re-signs it: the app would
      # reach TestFlight without aps-environment and iOS refuses to issue a push token. Signing
      # ad hoc with the entitlements file embeds them, and the export keeps them when it re-signs.
      - name: Embed entitlements in archive
        run: |
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/ServeUp.app"
          codesign --force --sign - --entitlements ios/ServeUp/ServeUp.entitlements "$APP"
          codesign -d --entitlements :- "$APP" | grep -A1 aps-environment \
            || { echo "aps-environment missing from the archived app."; exit 1; }

      - name: Export and upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -f "$KEY_PATH"
